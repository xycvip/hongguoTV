name: Build and publish TV update
on:
  push:
    branches:
      - custom
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests/lint for an automatically classified upstream update"
        required: false
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: tv-stable-release
  cancel-in-progress: false
jobs:
  release:
    if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[release]') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set monotonic build version and validate signing key
        env:
          KEYSTORE_B64: ${{ secrets.HONGGUOTV_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HONGGUOTV_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HONGGUOTV_KEY_ALIAS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/release.p12"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          if ! keytool -list -storetype PKCS12 -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "签名文件验证失败：请检查 HONGGUOTV_KEYSTORE_B64、HONGGUOTV_STORE_PASSWORD 和 HONGGUOTV_KEY_ALIAS 是否对应同一份 .p12 文件。" >&2
            exit 1
          fi
          echo "HONGGUOTV_KEYSTORE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          # APP_VERSION is the desired semantic-version baseline. If it matches the
          # latest release, automatically increment PATCH; if manually raised, honor it.
          APP_VERSION="$(sed -nE 's/^APP_VERSION=([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' kotlin-tv/version.properties | head -n 1)"
          if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "kotlin-tv/version.properties 中 APP_VERSION 必须为 MAJOR.MINOR.PATCH，例如 1.0.0。" >&2
            exit 1
          fi
          LATEST_MANIFEST="$RUNNER_TEMP/latest-update.json"
          LATEST_VERSION_CODE=0
          if curl --fail --silent --show-error --location \
              "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/update.json?cachebust=$(date +%s)" \
              --output "$LATEST_MANIFEST"; then
            LATEST_VERSION_CODE="$(python3 -c 'import json,sys; print(int(json.load(open(sys.argv[1])).get("versionCode", 0)))' "$LATEST_MANIFEST")"
            VERSION_NAME="$(python3 - "$APP_VERSION" "$LATEST_MANIFEST" <<'PY'
          import json, re, sys
          configured = tuple(map(int, sys.argv[1].split(".")))
          try:
              latest_name = str(json.load(open(sys.argv[2])).get("versionName", ""))
          except Exception:
              latest_name = ""
          match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)(?:-build\.\d+)?", latest_name)
          if not match:
              chosen = configured
          else:
              latest = tuple(map(int, match.groups()))
              chosen = (latest[0], latest[1], latest[2] + 1) if latest >= configured else configured
          print(".".join(map(str, chosen)))
          PY
          )"
          else
            VERSION_NAME="$APP_VERSION"
          fi
          DATE_CODE="$(TZ=Asia/Tokyo date +'%Y%m%d')"
          # Date + unique workflow run number makes versionCode monotonic across daily builds.
          VERSION_CODE="$((10#$DATE_CODE * 100 + GITHUB_RUN_NUMBER))"
          if (( LATEST_VERSION_CODE >= VERSION_CODE )); then
            VERSION_CODE="$((LATEST_VERSION_CODE + 1))"
          fi
          if (( VERSION_CODE > 2100000000 )); then
            echo "versionCode 超出 Android 支持上限，拒绝发布。" >&2
            exit 1
          fi
          echo "HONGGUOTV_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Using monotonic versionCode: $VERSION_CODE (latest published: $LATEST_VERSION_CODE)"
          echo "HONGGUOTV_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "UPDATE_TAG=kotlin-v${VERSION_NAME}" >> "$GITHUB_ENV"
      - name: Tests and release lint
        if: ${{ (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip-tests]')) && (github.event_name != 'workflow_dispatch' || inputs.skip_tests != true) }}
        run: ./kotlin-tv/gradlew -p kotlin-tv :core:test :app:lintRelease --console=plain
      - name: Build signed APK
        env:
          HONGGUOTV_STORE_PASSWORD: ${{ secrets.HONGGUOTV_STORE_PASSWORD }}
          HONGGUOTV_KEY_ALIAS: ${{ secrets.HONGGUOTV_KEY_ALIAS }}
          HONGGUOTV_KEY_PASSWORD: ${{ secrets.HONGGUOTV_KEY_PASSWORD }}
        run: ./kotlin-tv/gradlew -p kotlin-tv :app:assembleRelease --console=plain
      - name: Verify APK package name and versionCode
        run: |
          set -euo pipefail
          EXPECTED_VERSION_CODE="$HONGGUOTV_VERSION_CODE"
          APK="kotlin-tv/app/build/outputs/apk/release/app-release.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          BADGING="$("$AAPT" dump badging "$APK")"
          ACTUAL_PACKAGE="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          ACTUAL_VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\\([0-9]*\\)'.*/\\1/p" | head -n 1)"
          if [[ "$ACTUAL_PACKAGE" != "com.x.hongguotv" ]]; then
            echo "APK 包名不匹配：$ACTUAL_PACKAGE" >&2
            exit 1
          fi
          if [[ "$ACTUAL_VERSION_CODE" != "$EXPECTED_VERSION_CODE" ]]; then
            echo "APK 实际 versionCode=$ACTUAL_VERSION_CODE，预期=$EXPECTED_VERSION_CODE，拒绝发布。" >&2
            exit 1
          fi
          echo "Verified APK package=$ACTUAL_PACKAGE versionCode=$ACTUAL_VERSION_CODE"
      - name: Publish APK, source, and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-tv-update.py
      - name: Keep only the newest published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Keep the newest stable published release; delete older release entries only.
          # Git tags and source history are intentionally left untouched.
          OLD_RELEASE_IDS="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -s '[.[][] | select(.draft == false and .prerelease == false)] | sort_by(.published_at) | reverse | .[1:] | .[].id')"
          if [[ -z "$OLD_RELEASE_IDS" ]]; then
            echo "Only one stable release exists; nothing to delete."
            exit 0
          fi
          while IFS= read -r RELEASE_ID; do
            [[ -n "$RELEASE_ID" ]] || continue
            echo "Deleting old release ID $RELEASE_ID"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          done <<< "$OLD_RELEASE_IDS"
      - name: Keep only the newest application release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_TAG="$UPDATE_TAG"
          while IFS= read -r REF; do
            [[ -n "$REF" ]] || continue
            TAG="${REF#refs/tags/}"
            [[ "$TAG" == "$CURRENT_TAG" ]] && continue
            echo "Deleting old application tag: $TAG"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG"
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/kotlin-v" --jq '.[].ref')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tv-update-verification
          path: |
            kotlin-tv/core/build/reports/tests/test/
            kotlin-tv/app/build/reports/lint-results-release.*
            outputs/update.json
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
