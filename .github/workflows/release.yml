name: 红果TV正式构建与发布
on:
  push:
    branches:
      - custom
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tv-stable-release
  cancel-in-progress: false
jobs:
  release:
    name: 红果TV正式版构建与发布
    if: ${{ github.ref == 'refs/heads/custom' && (github.event_name != 'push' || contains(github.event.head_commit.message, '[release]')) }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: 检查发布脚本语法
        run: python3 -m py_compile scripts/publish-tv-update.py
      - name: 生成递增版本号并验证签名文件
        env:
          KEYSTORE_B64: ${{ secrets.HONGGUOTV_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HONGGUOTV_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HONGGUOTV_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/release.p12"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          if ! keytool -list -storetype PKCS12 -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "签名文件验证失败：请检查 HONGGUOTV_KEYSTORE_B64、HONGGUOTV_STORE_PASSWORD 和 HONGGUOTV_KEY_ALIAS 是否对应同一份 .p12 文件。" >&2
            exit 1
          fi
          echo "HONGGUOTV_KEYSTORE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          # APP_VERSION 是期望使用的语义化版本基准。如果它与
          # 最新发布版本相同，则自动递增修订号；如果手动调高，则采用手动设置的版本。
          APP_VERSION="$(sed -nE 's/^APP_VERSION=([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' kotlin-tv/version.properties | head -n 1)"
          if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "kotlin-tv/version.properties 中 APP_VERSION 必须为 MAJOR.MINOR.PATCH，例如 1.0.0。" >&2
            exit 1
          fi
          LATEST_MANIFEST="$RUNNER_TEMP/latest-update.json"
          LATEST_VERSION_CODE=0
          # 按照客户端相同的容错顺序读取上一版红果TV更新清单：
          # 优先读取 Releases API，其次读取 Raw 地址，最后尝试代理镜像。
          python3 - "$LATEST_MANIFEST" <<'PY'
          import json, sys, time, urllib.request, urllib.error
          output = sys.argv[1]
          headers = {
              "User-Agent": "HongguoTV-Release-Workflow",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Cache-Control": "no-cache",
          }
          def get(url, limit=2 * 1024 * 1024):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise RuntimeError("响应内容超过允许大小")
              return data
          manifest = None
          errors = []
          # 1）查找最新的非草稿红果TV发布版本及其 update.json。
          try:
              releases = json.loads(get(
                  "https://api.github.com/repos/xycvip/AppDownload/releases?per_page=100"
                  + "&cachebust=" + str(int(time.time()))
              ).decode("utf-8"))
              for release in releases:
                  if release.get("draft") or not str(release.get("tag_name", "")).startswith("hongguotv-v"):
                      continue
                  for asset in release.get("assets", []):
                      if asset.get("name") == "update.json" and asset.get("browser_download_url"):
                          manifest_url = asset["browser_download_url"]
                          manifest = json.loads(get(manifest_url, 65536).decode("utf-8"))
                          break
                  if manifest is not None:
                      break
              if manifest is None:
                  raise RuntimeError("未找到红果TV的 update.json 发布附件")
          except Exception as exc:
              errors.append("发布接口读取失败：" + str(exc))
              manifest = None
          # 2/3）读取 Raw 更新清单，先尝试直连，再依次尝试可用的代理镜像。
          if manifest is None:
              raw = "https://raw.githubusercontent.com/xycvip/AppDownload/main/hongguoTV/latest.json"
              candidates = [raw, "https://gh-proxy.com/" + raw,
                            "https://ghfast.top/" + raw, "https://gh-proxy.net/" + raw]
              for url in candidates:
                  try:
                      manifest = json.loads(get(url + "?cachebust=" + str(int(time.time())), 65536).decode("utf-8"))
                      break
                  except Exception as exc:
                      errors.append(url.split("/")[2] + ": " + str(exc))
          if manifest is None:
              raise SystemExit("无法读取上一版红果TV更新清单，已停止正式发布，避免版本号倒退或重复。详情：" + " | ".join(errors))
          if manifest.get("packageName") != "com.x.hongguotv":
              raise SystemExit("上一版更新清单中的应用包名不匹配，已停止版本号计算。")
          try:
              latest_code = int(manifest["versionCode"])
              latest_name = str(manifest["versionName"])
              if latest_code <= 0 or not __import__("re").fullmatch(r"\d+\.\d+\.\d+(?:-build\.\d+)?", latest_name):
                  raise ValueError("versionCode/versionName 格式无效")
          except Exception as exc:
              raise SystemExit("上一版更新清单缺少有效的 versionCode/versionName，已停止发布：" + str(exc))
          open(output, "w", encoding="utf-8").write(json.dumps(manifest, ensure_ascii=False))
          print("已成功读取并验证上一版红果TV更新清单：" + latest_name + "（versionCode=" + str(latest_code) + ")")
          PY
          LATEST_VERSION_CODE="$(python3 -c 'import json,sys; print(int(json.load(open(sys.argv[1])).get("versionCode", 0)))' "$LATEST_MANIFEST")"
          VERSION_NAME="$(python3 - "$APP_VERSION" "$LATEST_MANIFEST" <<'PY'
          import json, re, sys
          configured = tuple(map(int, sys.argv[1].split(".")))
          try:
              latest_name = str(json.load(open(sys.argv[2])).get("versionName", ""))
          except Exception:
              latest_name = ""
          match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)(?:-build\.\d+)?", latest_name)
          if not match:
              chosen = configured
          else:
              latest = tuple(map(int, match.groups()))
              chosen = (latest[0], latest[1], latest[2] + 1) if latest >= configured else configured
          print(".".join(map(str, chosen)))
          PY
          )"
          # versionCode 直接基于已验证的上一版递增，不依赖日期、时区或工作流运行编号。
          # 这样可避免并发/重跑造成冲突，并兼容历史上较大的旧版 versionCode。
          VERSION_CODE="$((LATEST_VERSION_CODE + 1))"

          if (( VERSION_CODE > 2100000000 )); then
            echo "versionCode 超出 Android 支持上限，已停止发布。" >&2
            exit 1
          fi
          echo "HONGGUOTV_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "采用递增版本号 versionCode：$VERSION_CODE（上一版已发布：$LATEST_VERSION_CODE)"
          echo "HONGGUOTV_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "UPDATE_TAG=hongguotv-v${VERSION_NAME}" >> "$GITHUB_ENV"
      - name: 运行单元测试和正式版代码检查
        if: ${{ !contains(github.event.head_commit.message || '', '[skip tests]') }}
        run: ./kotlin-tv/gradlew -p kotlin-tv :core:test :app:testReleaseUnitTest :app:lintRelease --console=plain
      - name: 构建并签名正式版 APK
        env:
          HONGGUOTV_STORE_PASSWORD: ${{ secrets.HONGGUOTV_STORE_PASSWORD }}
          HONGGUOTV_KEY_ALIAS: ${{ secrets.HONGGUOTV_KEY_ALIAS }}
          HONGGUOTV_KEY_PASSWORD: ${{ secrets.HONGGUOTV_KEY_PASSWORD }}
        run: ./kotlin-tv/gradlew -p kotlin-tv :app:assembleRelease --console=plain
      - name: 验证 APK 应用包名和版本号
        run: |
          set -euo pipefail
          EXPECTED_VERSION_CODE="$HONGGUOTV_VERSION_CODE"
          APK="kotlin-tv/app/build/outputs/apk/release/app-release.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          BADGING="$("$AAPT" dump badging "$APK")"
          ACTUAL_PACKAGE="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          ACTUAL_VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\\([0-9]*\\)'.*/\\1/p" | head -n 1)"
          if [[ "$ACTUAL_PACKAGE" != "com.x.hongguotv" ]]; then
            echo "APK 应用包名不匹配：$ACTUAL_PACKAGE" >&2
            exit 1
          fi
          if [[ "$ACTUAL_VERSION_CODE" != "$EXPECTED_VERSION_CODE" ]]; then
            echo "APK 实际版本号 版本号 versionCode=$ACTUAL_VERSION_CODE，预期版本号=$EXPECTED_VERSION_CODE，已停止发布。" >&2
            exit 1
          fi
          echo "APK 验证通过：应用包名=$ACTUAL_PACKAGE 版本号 versionCode=$ACTUAL_VERSION_CODE"
      - name: 发布 APK 并更新版本清单
        env:
          APPDOWNLOAD_TOKEN: ${{ secrets.APPDOWNLOAD_TOKEN }}
        run: python3 scripts/publish-tv-update.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        continue-on-error: true
        with:
          name: 红果TV发布验证报告
          path: |
            kotlin-tv/core/build/reports/tests/test/
            kotlin-tv/app/build/reports/lint-results-release.*
            outputs/update.json
      - name: 清理临时签名文件
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

# 只有定制分支验证通过后，才提交带有 [release] 标记的提交以启动正式发布。
# 单元测试、代码检查、APK 签名验证和 AppDownload 发布均为正式发布的必经步骤。
