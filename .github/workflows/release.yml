name: Build and publish TV update
on:
  push:
    branches:
      - custom
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests/lint for an automatically classified upstream update"
        required: false
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: tv-stable-release
  cancel-in-progress: false
jobs:
  release:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip-release]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set monotonic build version and validate signing key
        env:
          KEYSTORE_B64: ${{ secrets.HONGGUOTV_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HONGGUOTV_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HONGGUOTV_KEY_ALIAS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/release.p12"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          if ! keytool -list -storetype PKCS12 -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "签名文件验证失败：请检查 HONGGUOTV_KEYSTORE_B64、HONGGUOTV_STORE_PASSWORD 和 HONGGUOTV_KEY_ALIAS 是否对应同一份 .p12 文件。" >&2
            exit 1
          fi
          echo "HONGGUOTV_KEYSTORE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          UPSTREAM_GRADLE_URL="https://raw.githubusercontent.com/jycao2/hongguoTV/main/kotlin-tv/app/build.gradle.kts"
          UPSTREAM_VERSION="$(curl --fail --silent --show-error --location "$UPSTREAM_GRADLE_URL" | sed -nE 's/.*versionName.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' | head -n 1)"
          if [[ ! "$UPSTREAM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "无法从上游读取有效版本号：$UPSTREAM_VERSION" >&2
            exit 1
          fi
          IFS='.' read -r UPSTREAM_MAJOR UPSTREAM_MIDDLE UPSTREAM_PATCH <<< "$UPSTREAM_VERSION"
          DATE_PREFIX="$(TZ=Asia/Tokyo date +'%y.%m')"
          TODAY_JST="$(TZ=Asia/Tokyo date +'%Y-%m-%d')"
          DAILY_COUNT="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.published_at != null) | [.tag_name, .published_at] | @tsv' | python3 -c 'import datetime,sys; from zoneinfo import ZoneInfo; today=sys.argv[1]; prefix=sys.argv[2]; rows=[line.rstrip("\n").split("\t",1) for line in sys.stdin if "\t" in line]; print(sum(1 for tag,stamp in rows if tag.startswith("kotlin-v"+prefix+".") and datetime.datetime.fromisoformat(stamp.replace("Z","+00:00")).astimezone(ZoneInfo("Asia/Tokyo")).date().isoformat()==today))' "$TODAY_JST" "$DATE_PREFIX")"
          VERSION_NAME="${DATE_PREFIX}.${UPSTREAM_MIDDLE}.${DAILY_COUNT}"
          if (( DAILY_COUNT >= 99 )); then
            echo "当天发布次数达到版本号容量上限，拒绝生成重复 versionCode。" >&2
            exit 1
          fi
          DATE_CODE="$(TZ=Asia/Tokyo date +'%Y%m%d')"
          VERSION_CODE="$((10#$DATE_CODE * 100 + DAILY_COUNT + 1))"
          # Never publish a versionCode less than or equal to the latest published APK.
          # This also protects against old/new runs racing or a release being published
          # after the daily counter was calculated.
          LATEST_MANIFEST="$RUNNER_TEMP/latest-update.json"
          LATEST_VERSION_CODE=0
          if curl --fail --silent --show-error --location \
              "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/update.json" \
              --output "$LATEST_MANIFEST"; then
            LATEST_VERSION_CODE="$(python3 -c 'import json,sys; print(int(json.load(open(sys.argv[1])).get("versionCode", 0)))' "$LATEST_MANIFEST")"
          fi
          if (( LATEST_VERSION_CODE >= VERSION_CODE )); then
            VERSION_CODE="$((LATEST_VERSION_CODE + 1))"
          fi
          if (( VERSION_CODE > 2100000000 )); then
            echo "versionCode 超出 Android 支持上限，拒绝发布。" >&2
            exit 1
          fi
          echo "HONGGUOTV_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Using verified monotonic versionCode: $VERSION_CODE (latest published: $LATEST_VERSION_CODE)"
          echo "HONGGUOTV_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "UPDATE_TAG=kotlin-v${VERSION_NAME}-build.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Tests and release lint
        if: ${{ github.event_name != 'push' && inputs.skip_tests != true }}
        run: ./kotlin-tv/gradlew -p kotlin-tv :core:test :app:lintRelease --console=plain
      - name: Build signed APK
        env:
          HONGGUOTV_STORE_PASSWORD: ${{ secrets.HONGGUOTV_STORE_PASSWORD }}
          HONGGUOTV_KEY_ALIAS: ${{ secrets.HONGGUOTV_KEY_ALIAS }}
          HONGGUOTV_KEY_PASSWORD: ${{ secrets.HONGGUOTV_KEY_PASSWORD }}
        run: ./kotlin-tv/gradlew -p kotlin-tv :app:assembleRelease --console=plain
      - name: Publish APK, source, and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-tv-update.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tv-update-verification
          path: |
            kotlin-tv/core/build/reports/tests/test/
            kotlin-tv/app/build/reports/lint-results-release.*
            outputs/update.json
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
