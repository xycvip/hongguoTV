name: Sync verified APK to source Kotlin Release
on:
  push:
    branches: ['custom']
permissions:
  contents: write
jobs:
  sync:
    if: ${{ contains(github.event.head_commit.message, '[source-release-sync]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate source Release sync script
        run: python3 -m py_compile scripts/sync-source-release.py
      - name: Verify AppDownload APK and sync source Release
        env:
          GH_TOKEN: ${{ github.token }}
          APPDOWNLOAD_TOKEN: ${{ secrets.APPDOWNLOAD_TOKEN }}
        run: python3 scripts/sync-source-release.py
