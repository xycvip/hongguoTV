name: Verify Kotlin standalone APK # unified tests, lint, and debug build
on:
  push:
    branches: ['main', 'codex/kotlin-standalone', 'custom']
    tags: ['kotlin-v*']
  pull_request:
    paths: ['kotlin-tv/**', 'scripts/build-kotlin.sh', '.github/workflows/kotlin-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    # 发布提交显式标记 [skip-tests] 时跳过独立验证工作流；正式发布仍由 release 工作流构建签名 APK。
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip-tests]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Validate release publisher Python syntax
        run: python3 -m py_compile scripts/publish-tv-update.py
      - name: Unit tests, Android lint, and installable development APK
        run: ./kotlin-tv/gradlew -p kotlin-tv :core:test :app:lintDebug :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: kotlin-native-verification
          path: |
            kotlin-tv/core/build/reports/tests/test/
            kotlin-tv/app/build/reports/lint-results-debug.*
            kotlin-tv/app/build/outputs/apk/debug/*.apk
