name: Prepare tested custom update

on:
  workflow_run:
    workflows: ["Sync upstream main"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-custom-update
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout custom branch
        uses: actions/checkout@v4
        with:
          ref: custom
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch latest main and custom
        run: |
          git fetch origin main custom
          git checkout -B automation/upstream-update origin/custom

      - name: Merge main into isolated candidate branch
        run: |
          set -euo pipefail
          git merge --no-edit origin/main

      - name: Detect playback, search, and recommendation interface changes
        id: api_changes
        shell: bash
        run: |
          set -euo pipefail
          base="$(git merge-base origin/custom origin/main)"
          git diff --name-only "$base"..origin/main > /tmp/upstream-files.txt
          {
            echo "## Interface-change review"
            echo
            echo "The workflow specifically checks upstream changes related to playback, search, and recommendations."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          : > api-change-report.md
          echo "## Playback / search / recommendation interface scan" >> api-change-report.md
          echo >> api-change-report.md
          api_files="$(grep -Ei '(^|/)(ThirdCms|ThirdStore|VideoDataSource|Library|.*Api.*|.*Api.*|.*Repository.*|.*Source.*|.*Player.*|.*Playback.*|.*Search.*|.*Recommend.*|.*Parser.*|.*Network.*|.*Request.*|.*Response.*)\.(kt|java)$|(^|/)(api|network|repository|datasource|player|playback|search|recommend|parser)/' /tmp/upstream-files.txt || true)"
          if [ -n "$api_files" ]; then
            echo "API_RELATED=true" >> "$GITHUB_OUTPUT"
            echo "### Detected interface-related files" >> api-change-report.md
            printf '%s\n' "$api_files" | sort -u >> api-change-report.md
            {
              echo "### Playback/search/recommendation-related files"
              printf '%s\n' "$api_files" | sort -u
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "API_RELATED=false" >> "$GITHUB_OUTPUT"
            echo "No interface-related paths were detected by filename rules." >> api-change-report.md
            echo "No interface-related paths detected by filename rules." >> "$GITHUB_STEP_SUMMARY"
          fi

          # Also scan changed Kotlin source for protocol, request-header, JSON, and playback markers.
          # Print filenames only; never print matching source lines or possible credentials.
          content_files="$(git diff --name-only --diff-filter=ACMRT "$base"..origin/main -- '*.kt' '*.java' || true)"
          if [ -n "$content_files" ]; then
            printf '%s\n' "$content_files" | while IFS= read -r f; do
              if git diff "$base"..origin/main -- "$f" | grep -Eiq '^[+].*(https?://|Authorization|User-Agent|headers?\b|JSONObject|Gson|Moshi|Json|playUrl|parse.*(play|search|recommend)|recommend|search.*(api|url)|episode.*(url|play))'; then
                echo "$f"
              fi
            done | sort -u > /tmp/api-content-files.txt
          else
            : > /tmp/api-content-files.txt
          fi
          if [ -s /tmp/api-content-files.txt ]; then
            echo "### Additional source files with interface/protocol markers" >> api-change-report.md
            cat /tmp/api-content-files.txt >> api-change-report.md
            {
              echo
              echo "### Additional source files with interface/protocol markers"
              cat /tmp/api-content-files.txt
            } >> "$GITHUB_STEP_SUMMARY"
            echo "API_RELATED=true" >> "$GITHUB_OUTPUT"
          fi

          {
            echo
            echo "### Review policy"
            echo "- Playback interface changes: high priority; verify play URL extraction, headers, redirects, and episode switching."
            echo "- Search interface changes: verify request parameters and result parsing."
            echo "- Recommendation interface changes: verify feed/category requests and result parsing."
            echo "- This scan is heuristic; it may miss interface changes implemented in generic files. It does not make live requests to third-party services."
          } >> api-change-report.md

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Run tests, lint, and debug APK build
        run: ./kotlin-tv/gradlew -p kotlin-tv :core:test :app:lintDebug :app:assembleDebug --console=plain

      - name: Summarize incoming upstream commits
        run: |
          {
            echo "## Upstream changes proposed for custom"
            echo
            echo "This is a candidate only. The custom branch has not been changed."
            echo
            echo "### Main commits not present in custom"
            git log --oneline origin/custom..origin/main || true
            echo
            echo "### Files changed by the merge"
            git diff --name-status origin/custom...HEAD || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload interface-change report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playback-search-recommendation-interface-report
          if-no-files-found: warn
          path: api-change-report.md

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-update-verification
          if-no-files-found: ignore
          path: |
            kotlin-tv/core/build/reports/tests/test/
            kotlin-tv/app/build/reports/lint-results-debug.*
            kotlin-tv/app/build/outputs/apk/debug/*.apk

      - name: Publish tested candidate branch
        run: git push --force-with-lease origin HEAD:automation/upstream-update

      - name: Open or update review pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="Review upstream updates for custom"
          api_report="$(cat api-change-report.md 2>/dev/null || echo 'Interface scan report was not generated; inspect the workflow artifacts.')"
          body="$(cat <<EOF
          ## Automated update candidate

          This pull request proposes merging `main` into `custom`.

          - The merge is prepared on an isolated candidate branch after each successful upstream sync.
          - Kotlin unit tests, Android lint, and a debug APK build must pass before the candidate PR is updated.
          - Playback, search, and recommendation interface changes receive a dedicated filename/content-marker scan and a report artifact.
          - The `custom` branch is not overwritten by the scan; this PR is the review point before any merge.
          - A successful build does not prove live third-party APIs still work. Validate search results, recommendations, playback URL extraction, headers, redirects, and episode switching on a real device.

          ### Interface scan report

          ${api_report}

          The scan is heuristic and can miss changes in generic files. If merge conflicts or tests fail, this run does not publish a new candidate. Resolve the issue before retrying.
          EOF
          )"
          if gh pr view automation/upstream-update --json number >/dev/null 2>&1; then
            gh pr edit automation/upstream-update --title "$title" --body "$body"
          else
            gh pr create --base custom --head automation/upstream-update --title "$title" --body "$body"
          fi
