name: 检查上游更新并生成定制分支差异报告

on:
  workflow_run:
    workflows: ["同步上游主分支"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: review-upstream-for-custom
  cancel-in-progress: false

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: 检出定制分支并获取主分支
        uses: actions/checkout@v4
        with:
          ref: custom
          fetch-depth: 0

      - name: 对比上游改动（不修改定制分支）
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main custom
          base="$(git merge-base origin/custom origin/main)"
          if [ -z "$base" ]; then
            echo "定制分支与主分支之间没有共同的历史基点。" >&2
            exit 1
          fi

          git log --oneline --decorate "$base"..origin/main > upstream-commits.txt
          git diff --name-status "$base"..origin/main > upstream-files.txt
          git diff --stat "$base"..origin/main > upstream-stat.txt
          git diff --binary "$base"..origin/main > upstream-changes.patch

          {
            echo "# 上游更新检查报告"
            echo
            echo "- 上游分支：origin/main（已同步原作者 main）"
            echo "- 定制分支：origin/custom（本工作流不会修改）"
            echo "- 共同基点：$base"
            echo
            echo "## 上游新增提交"
            if [ -s upstream-commits.txt ]; then cat upstream-commits.txt; else echo "无新增提交"; fi
            echo
            echo "## 文件变化"
            if [ -s upstream-files.txt ]; then cat upstream-files.txt; else echo "没有文件变化。"; fi
            echo
            echo "## 变化统计"
            if [ -s upstream-stat.txt ]; then cat upstream-stat.txt; else echo "无差异。"; fi
            echo
            echo "## 需要人工评估的定制保护范围"
            echo "重点检查包名/签名/版本号、更新地址与发布流程、启动播放逻辑、首页和播放界面、备份恢复及账号功能。"
            echo
            echo "安全策略：本次只生成差异报告，不执行 merge、cherry-pick、push 或发布，不会改动 custom。"
          } > upstream-review-report.md

          {
            echo "## 上游更新检查"
            echo
            echo "共同基点：$base"
            echo
            echo "### 上游新增提交"
            if [ -s upstream-commits.txt ]; then cat upstream-commits.txt; else echo "无新增提交"; fi
            echo
            echo "### 文件变化"
            if [ -s upstream-files.txt ]; then cat upstream-files.txt; else echo "无差异"; fi
            echo
            echo "custom 分支未被修改。差异报告和补丁已作为工作流附件保存。"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -s upstream-files.txt ]; then
            echo "HAS_UPDATES=true" >> "$GITHUB_OUTPUT"
          else
            echo "HAS_UPDATES=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 上传上游更新报告和补丁文件
        uses: actions/upload-artifact@v4
        with:
          name: upstream-review-${{ github.run_number }}
          if-no-files-found: error
          path: |
            upstream-review-report.md
            upstream-commits.txt
            upstream-files.txt
            upstream-stat.txt
            upstream-changes.patch
