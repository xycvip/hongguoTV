name: Sync upstream main

on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-upstream.yml']
  workflow_dispatch:
  schedule:
    - cron: "17 3,15 * * *"

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream main
        run: |
          git remote add upstream https://github.com/jycao2/hongguoTV.git
          git fetch upstream main

      - name: Sync upstream source while preserving fork workflows
        shell: bash
        run: |
          set -euo pipefail

          # Keep this fork's workflow definitions intact so scheduled sync and
          # custom review automation remain available without requiring a PAT
          # with the special workflow scope.
          git diff --name-only --diff-filter=D HEAD upstream/main -- . ':(exclude).github/workflows/**' |
            while IFS= read -r file; do
              [ -n "$file" ] && git rm -f -- "$file"
            done

          # Copy every upstream path except .github/workflows.
          git checkout upstream/main -- . ':(exclude).github/workflows/**'
          git add -A -- . ':(exclude).github/workflows/**'

          if git diff --cached --quiet; then
            echo "Source files already match upstream main."
            exit 0
          fi

          git commit -m "Sync source files from upstream main"

      - name: Push synchronized main
        run: git push origin HEAD:main
