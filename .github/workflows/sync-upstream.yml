name: Sync upstream main

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3,15 * * *"

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Preserve fork automation workflows
        run: |
          mkdir -p /tmp/fork-workflows
          for file in sync-upstream.yml prepare-custom-update.yml cleanup-runs.yml; do
            if [ -f ".github/workflows/$file" ]; then
              cp ".github/workflows/$file" "/tmp/fork-workflows/$file"
            fi
          done

      - name: Fetch upstream main
        run: |
          git remote add upstream https://github.com/jycao2/hongguoTV.git
          git fetch upstream main

      - name: Reset main to upstream and restore fork automation
        run: |
          set -euo pipefail
          git checkout main
          git reset --hard upstream/main
          mkdir -p .github/workflows
          cp /tmp/fork-workflows/*.yml .github/workflows/
          git add .github/workflows/sync-upstream.yml .github/workflows/prepare-custom-update.yml .github/workflows/cleanup-runs.yml
          if git diff --cached --quiet; then
            echo "Upstream code and preserved automation are already up to date."
            exit 0
          fi
          git commit -m "Sync main with upstream while preserving fork automation"

      - name: Push synchronized main
        run: git push --force-with-lease origin HEAD:main
